name: Build extension distributions

on:
  push:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out RWPP
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package was removed from Google's SDK repository.
          # Leaving the action's default packages installs it, sdkmanager exits 1,
          # and every later build and publish step is skipped.
          packages: platform-tools
      - name: Install the stable Android platform used by CI
        shell: bash
        run: |
          set -euo pipefail
          # API 37 is only shipped with Android Studio previews and is absent from
          # the stable SDK repository that CI's sdkmanager can see. The archives
          # only need android.jar for D8 and the Android plugin, so CI builds with
          # the latest stable platform and overrides the compile level below.
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify JVM and Android packs
        run: >-
          ./gradlew
          -PandroidCompileSdk=36
          verifyJvmExtensionPack verifyAndroidExtensionPack
      - name: Collect packs and individual extension archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          python3 - <<'PY'
          import glob, pathlib, shutil
          patterns = [
              'build/distributions/rwpp-*-jvm-extensions.zip',
              'build/distributions/rwpp-*-android-extensions.zip',
              'rwpp-api/build/extensions/rwpp-api-*-jvm.jar',
              'rwpp-api/build/extensions/rwpp-api-*-android.jar',
              'rwpp-client/build/extensions/rwpp-client-*-jvm.jar',
              'rwpp-client/build/extensions/rwpp-client-*-android.jar',
          ]
          for pattern in patterns:
              matches = glob.glob(pattern)
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one artifact for {pattern}: {matches}')
              shutil.copy2(matches[0], pathlib.Path('release-assets') / pathlib.Path(matches[0]).name)
          PY
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rwpp-extensions-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'rwpp' }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      ASSETS_DIR: release-assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rwpp-extensions-${{ github.sha }}
          path: release-assets
      - name: Upload verified assets to this release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
      - name: Check out the publishing script from the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          path: .ci/repo
          clean: false
          persist-credentials: false
      - name: Publish the same archives to R2 and refresh the registry
        run: python3 .ci/repo/scripts/publish-r2.py

  publish-central:
    if: github.event_name == 'release' && github.event.action == 'published' && !github.event.release.prerelease && !github.event.release.draft
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: maven-central-release
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the signed API and client Maven bundle
        id: bundle
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$GPG_PRIVATE_KEY" || { echo "::error::Configure GPG_PRIVATE_KEY"; exit 1; }
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]]
          ./gradlew --no-daemon -PandroidCompileSdk=36 bundleForCentral
          bundle="build/rwpp-$version-central-bundle.zip"
          python3 .github/scripts/publish-central.py verify rwpp "$RELEASE_TAG" "$bundle"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Submit one deployment or resume an existing one
        env:
          GH_TOKEN: ${{ github.token }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          BUNDLE: ${{ steps.bundle.outputs.path }}
        run: python3 .github/scripts/publish-central.py submit rwpp "$RELEASE_TAG" "$BUNDLE"
      - name: Save deployment ID for reruns
        if: ${{ always() && hashFiles('build/new-central-deployment') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: central-deployment-rwpp-${{ steps.bundle.outputs.version }}
          path: build/central-deployment.json
      - name: Wait for Maven Central
        if: ${{ hashFiles('build/central-deployment.json') != '' }}
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: python3 .github/scripts/publish-central.py wait rwpp "$RELEASE_TAG"
